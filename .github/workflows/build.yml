name: Build MiMo Studio APK

# 推送到 main/master 分支时自动编译，也可以手动触发
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# 允许创建 Release 和上传文件
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 编译 Debug APK
        run: gradle assembleDebug

      - name: 发布 APK 到 Releases
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: v${{ github.run_number }}
          name: MiMo Studio v${{ github.run_number }}
